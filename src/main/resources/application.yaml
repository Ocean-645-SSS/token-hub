server:
  port: ${SERVER_PORT:8080}
spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: tokenhub
  profiles:
    default: local
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${TOKENHUB_DB_URL:jdbc:mysql://127.0.0.1:3306/tokenhub?useSSL=false&serverTimezone=UTC&characterEncoding=utf8}
    username: ${TOKENHUB_DB_USERNAME:root}
    password: ${TOKENHUB_DB_PASSWORD:}
  data:
    redis:
      host: ${TOKENHUB_REDIS_HOST:127.0.0.1}
      port: ${TOKENHUB_REDIS_PORT:6379}
      timeout: ${TOKENHUB_REDIS_TIMEOUT:2s}
  rabbitmq:
    host: ${TOKENHUB_RABBITMQ_HOST:127.0.0.1}
    port: ${TOKENHUB_RABBITMQ_PORT:5672}
    username: ${TOKENHUB_RABBITMQ_USERNAME:guest}
    password: ${TOKENHUB_RABBITMQ_PASSWORD:guest}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
  jackson:
    default-property-inclusion: non_null # JSON处理时忽略非空字段
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
tokenhub:
  admin:
    user-ids: ${TOKENHUB_ADMIN_USER_IDS:}
  package-index-sync:
    max-attempts: ${TOKENHUB_PACKAGE_INDEX_MAX_ATTEMPTS:3}
    retry-backoff-ms: ${TOKENHUB_PACKAGE_INDEX_RETRY_BACKOFF_MS:200}
    reconciliation-interval-ms: ${TOKENHUB_PACKAGE_INDEX_RECONCILIATION_INTERVAL_MS:60000}
  billing:
    credit-limit: ${TOKENHUB_BILLING_CREDIT_LIMIT:5000}
    safety-margin: ${TOKENHUB_BILLING_SAFETY_MARGIN:512}
    reservation-timeout-seconds: ${TOKENHUB_BILLING_RESERVATION_TIMEOUT_SECONDS:300}
  model:
    base-url: ${TOKENHUB_MODEL_BASE_URL:http://127.0.0.1:18080}
    api-key: ${TOKENHUB_MODEL_API_KEY:}
    guide-model: ${TOKENHUB_MODEL_GUIDE_MODEL:gpt-4o-mini}
    max-input-characters: ${TOKENHUB_MODEL_MAX_INPUT_CHARACTERS:32000}
    max-output-tokens: ${TOKENHUB_MODEL_MAX_OUTPUT_TOKENS:4096}
    connect-timeout-ms: ${TOKENHUB_MODEL_CONNECT_TIMEOUT_MS:3000}
    read-timeout-ms: ${TOKENHUB_MODEL_READ_TIMEOUT_MS:30000}
    max-attempts: ${TOKENHUB_MODEL_MAX_ATTEMPTS:3}
  rate-limit:
    api-key-qps: ${TOKENHUB_RATE_LIMIT_API_KEY_QPS:5}
  elasticsearch:
    url: ${TOKENHUB_ES_URL:http://127.0.0.1:9200}
  messaging:
    poll-interval-ms: ${TOKENHUB_MESSAGE_POLL_INTERVAL_MS:200}
    batch-size: ${TOKENHUB_MESSAGE_BATCH_SIZE:500}
    max-in-flight: ${TOKENHUB_MESSAGE_MAX_IN_FLIGHT:1000}
    claim-timeout-seconds: ${TOKENHUB_MESSAGE_CLAIM_TIMEOUT_SECONDS:30}
    retry-delay-seconds: ${TOKENHUB_MESSAGE_RETRY_DELAY_SECONDS:5}
    publisher-core-threads: ${TOKENHUB_PUBLISHER_CORE_THREADS:4}
    publisher-max-threads: ${TOKENHUB_PUBLISHER_MAX_THREADS:8}
    publisher-queue-capacity: ${TOKENHUB_PUBLISHER_QUEUE_CAPACITY:500}
  rabbit:
    consumer:
      concurrency: ${TOKENHUB_RABBIT_CONSUMER_CONCURRENCY:4}
      max-concurrency: ${TOKENHUB_RABBIT_CONSUMER_MAX_CONCURRENCY:8}
      prefetch: ${TOKENHUB_RABBIT_CONSUMER_PREFETCH:32}
  jwt:
    secret: ${TOKENHUB_JWT_SECRET:tokenhub-v1-development-secret-change-before-production-20260919}
    access-token-ttl-seconds: ${TOKENHUB_JWT_ACCESS_TOKEN_TTL_SECONDS:7200}
logging:
  level:
    com.tokenhub: info
  pattern:
    dateformat: mm:ss.SSS
