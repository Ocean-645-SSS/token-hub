services:
  mysql:
    image: mysql:8.0.33
    environment:
      MYSQL_ROOT_PASSWORD: ${TOKENHUB_MYSQL_ROOT_PASSWORD:?set TOKENHUB_MYSQL_ROOT_PASSWORD before starting Compose}
      MYSQL_DATABASE: tokenhub
    ports:
      - "3306:3306"
    volumes:
      - ./src/main/resources/db/tokenhub.sql:/docker-entrypoint-initdb.d/01-tokenhub.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p\"$$MYSQL_ROOT_PASSWORD\""]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3.13-management
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.21
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30

  provider-mock:
    image: python:3.12-alpine
    command: ["python", "/app/provider_mock.py"]
    ports:
      - "18080:18080"
    volumes:
      - ./docs/jmeter/provider_mock.py:/app/provider_mock.py:ro
